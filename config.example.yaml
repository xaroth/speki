# Copy to config.yaml and adjust. Every key can also be set with an environment variable:
# SPEKI_ plus the key's path in upper case, e.g. SPEKI_TELEMETRY_LOG_LEVEL. Lists are comma separated.
# A secret can be read from a file: private_key_file here, SPEKI_GITHUB_PRIVATE_KEY_FILE in the environment.

# The address clients reach speki at. Tokens are bound to it; it must be https.
public_url: https://speki.example.com

# Public server: MCP, sign-in, health checks.
listen: ":8080"
# Internal server: metrics and status. Must differ from listen; don't expose it publicly.
metrics_listen: ":9090"

github:
  app_id: 123456
  private_key_file: /run/secrets/github-app.pem
  client_id: Iv23liAbCdEf
  client_secret_file: /run/secrets/github-client-secret
  # Numeric IDs of the accounts whose installations count. Defaults to the app's owner.
  # allowed_accounts: [87654321]

access:
  # Users must be an active member of at least one of these organisations. Empty: no check.
  # required_orgs: [eve-online-tools]

auth:
  # The keys speki seals its tokens with. See the docs for the format and how to rotate them.
  keys_file: /run/secrets/speki-keys.yaml
  # Or a single key, base64 of at least 32 random bytes. Rotating it means moving to keys_file first.
  # key_file: /run/secrets/speki-key
  # Hosts whose client metadata documents are accepted (web clients like claude.ai).
  # client_metadata_hosts: [claude.ai]

sync:
  # Shallow git copies and search indexes. Can be wiped, but keeping it makes restarts fast.
  data_dir: /var/lib/speki
  poll_interval: 60s
  discovery_interval: 5m

# Set to run more than one instance: they share sign-in state and tell each other about changes.
# redis:
#   url_file: /run/secrets/redis-url   # redis:// or rediss://, password included

telemetry:
  log_level: info
  # OpenTelemetry traces, sent where the standard OTEL_EXPORTER_OTLP_* variables say.
  # tracing: false

# Optional: what this speki is, for people who connect to more than one.
# instance:
#   name: work                       # the server is called speki-work
#   title: Fenris work knowledge
#   description: Documentation for Fenris projects and services: architecture, runbooks and decisions.
