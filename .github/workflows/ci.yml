name: CI

on:
  pull_request:
    paths-ignore: ['docs/**', '**.md']
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']

permissions:
  contents: read

# A group keeps only one pending run, so non-PR runs get their own group to avoid skipping any.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CGO_ENABLED: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Only the test job writes the setup-go cache, so it holds the race-built cgo artifacts.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      # golangci-lint runs govet, so there is no separate vet step.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: arduino/setup-task@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task test

  image:
    name: Image build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build --build-arg VERSION=${{ github.sha }} -t speki:ci .
