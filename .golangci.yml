version: "2"

run:
  build-tags:
    - sqlite_fts5
    - sqlite_omit_load_extension

linters:
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - forbidigo
    - gocritic
    - misspell
    - nilerr
    - noctx
    - revive
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    forbidigo:
      forbid:
        - pattern: errors\.As\b
          msg: use errors.AsType
    misspell:
      ignore-rules:
        - signins # speki_signins_total
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: indent-error-flow
        - name: error-strings
        - name: error-return
        - name: receiver-naming
        - name: unused-parameter
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - noctx

formatters:
  enable:
    - gci
    - gofmt
  settings:
    gci:
      sections:
      - standard
      - default
      - prefix(github.com/xaroth)
      - prefix(github.com/xaroth/speki)
      - blank
      custom-order: true
