version: '3'

silent: true

vars:
  BIN_DIR: bin
  # The search index needs FTS5; loading extensions is compiled out.
  TAGS: sqlite_fts5,sqlite_omit_load_extension
  GOVULNCHECK: golang.org/x/vuln/cmd/govulncheck@v1.9.0
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev

tasks:
  build:
    summary: Build the speki binary
    cmds:
      - CGO_ENABLED=1 go build -tags '{{.TAGS}}' -ldflags "-X main.version={{.VERSION}}" -o {{.BIN_DIR}}/speki ./cmd/speki

  test:
    summary: Run all tests with the race detector
    cmds:
      # Skip the 1s race-detector exit sleep per test binary; a caller's GORACE comes later and wins.
      - CGO_ENABLED=1 GORACE="atexit_sleep_ms=0 $GORACE" go test -race -tags '{{.TAGS}}' ./...

  lint:
    summary: Run golangci-lint
    cmds:
      - golangci-lint run --build-tags '{{.TAGS}}' ./...

  vet:
    summary: Run go vet
    cmds:
      - CGO_ENABLED=1 go vet -tags '{{.TAGS}}' ./...

  vuln:
    summary: Check dependencies and code for known vulnerabilities
    cmds:
      - go run {{.GOVULNCHECK}} -tags '{{.TAGS}}' ./...

  vuln:image:
    summary: Check the binary in a published image for known vulnerabilities
    vars:
      IMAGE: '{{.IMAGE | default "ghcr.io/xaroth/speki:latest"}}'
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - |
        id=$(docker create --pull always {{.IMAGE}})
        docker cp "$id:/usr/local/bin/speki" {{.BIN_DIR}}/speki-image
        docker rm "$id" >/dev/null
      - go run {{.GOVULNCHECK}} -mode=binary -format json {{.BIN_DIR}}/speki-image > {{.BIN_DIR}}/speki-image.vuln.json
      # Binary mode can't rule out linked but unreachable code, so only findings with a fix fail: a
      # rebuild or dependency bump clears those.
      - |
        ids=$(jq -r 'select(.finding.trace[0].function and .finding.fixed_version) | .finding.osv' {{.BIN_DIR}}/speki-image.vuln.json | sort -u)
        if [ -n "$ids" ]; then
          echo "{{.IMAGE}} has fixed vulnerabilities, cut a release:" $ids
          exit 1
        fi

  fuzz:
    summary: Fuzz Parse and Touch for a short while
    vars:
      FUZZTIME: '{{.FUZZTIME | default "30s"}}'
    cmds:
      - go test -run '^$' -fuzz FuzzParseTouch -fuzztime {{.FUZZTIME}} ./document

  ci:
    summary: What CI runs on a pull request
    cmds:
      - task: lint
      - task: test

  run:
    summary: Build and run speki with ./config.yaml
    deps: [build]
    cmds:
      - ./{{.BIN_DIR}}/speki {{.CLI_ARGS}}
