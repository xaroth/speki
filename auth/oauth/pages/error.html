{{define "error.html"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Name}}</title>
{{template "style"}}
</head>
<body>
<div class="page">
{{template "margin" .}}
<main>
<h1>{{.Title}}</h1>
<p class="big">{{.Detail}}</p>
{{if .Login}}<p class="aside">You signed in to GitHub as <strong>@{{.Login}}</strong>. If that's the wrong account, sign in again and pick the other one on GitHub's account screen.</p>{{end}}
</main>
</div>
</body>
</html>
{{end}}
